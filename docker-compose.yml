version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    ports: ["8000:8000"]
    volumes: [".:/app"]
